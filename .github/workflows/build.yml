name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: pip install lupa

      - name: Offline tests
        run: python test/run_tests.py

      - name: Build pack and release zip
        run: python tools/build_mod.py --release

      - name: Tag must match the script version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python tools/build_mod.py --print-version)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match script version $version"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ProactiveCommand
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Proactive Command $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md $pre
